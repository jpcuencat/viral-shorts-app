# Despliegue local (lo usan `npm run deploy:local` y el CD de GitHub Actions):
#   docker compose --env-file .env.local up --build -d
# App en http://localhost:3100. Antes, detén `npm run dev:all`: los dos workers tomarían los mismos trabajos de la cola.
name: viral-shorts-app

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: viral-shorts-app:${APP_VERSION:-latest}
    container_name: viral-shorts-app
    env_file: .env.local
    environment:
      APP_VERSION: ${APP_VERSION:-latest}
      # n8n corre en el equipo: desde el contenedor se llega por host.docker.internal
      N8N_LOCALHOST_ALIAS: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3100:3000"
    volumes:
      - output:/app/public/output
      - vault:/app/public/ai-vault
      - temp:/app/public/temp
      - photos:/app/public/custom-photos
      - videos:/app/public/custom-videos
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # ── Túnel de Cloudflare para probar la app desde fuera (npm run tunnel) ───────────────────────────
  # Va en su propio contenedor: los despliegues solo recrean "app", así que el túnel (y su URL) no cambia.
  # Túnel con nombre: URL FIJA para siempre (requiere dominio en Cloudflare y CLOUDFLARE_TUNNEL_TOKEN en .env.local).
  tunnel-fijo:
    image: cloudflare/cloudflared:2024.12.2
    container_name: viral-shorts-tunnel
    profiles: ["tunnel-fijo"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-sin-token}
    depends_on: [app]
    restart: unless-stopped

  # Túnel rápido (trycloudflare.com): gratis y sin cuenta; la URL se mantiene entre despliegues,
  # pero cambia si este contenedor se reinicia (p. ej. al reiniciar el equipo).
  tunnel-rapido:
    image: cloudflare/cloudflared:2024.12.2
    container_name: viral-shorts-tunnel
    profiles: ["tunnel-rapido"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:3000
    ports:
      - "127.0.0.1:2000:2000"
    depends_on: [app]
    restart: unless-stopped

volumes:
  output:
  vault:
  temp:
  photos:
  videos:
  logs:
